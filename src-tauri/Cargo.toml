[package]
name = "geovanta-desktop"
version = "1.1.0"
description = "Geovanta — Professional Vector Studio & SVG Editor (64-Bit Windows Desktop App)"
authors = ["Geovanta Studio"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "geovanta_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
